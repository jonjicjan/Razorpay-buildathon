# Render Blueprint — https://render.com
# Connect this repo, then deploy the "web" service.
services:
  - type: web
    name: chargeback-sentinel
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PORT
        value: 8000
