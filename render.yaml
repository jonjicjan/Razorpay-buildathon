# Render Blueprint — https://render.com
# Dashboard → New → Blueprint → connect jonjicjan/Razorpay-buildathon
services:
  - type: web
    name: chargeback-sentinel
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Do NOT hardcode PORT — Render injects it automatically.
